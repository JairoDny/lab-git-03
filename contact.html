<body style="font-family: Arial; background-color: #ffffff; margin: 20px;">

  <!-- Menú de navegación -->
  <nav style="background-color: #333; padding: 10px;">
    <a href="index.html" style="color: white; margin-right: 15px;">Inicio</a>
    <a href="about.html" style="color: white; margin-right: 15px;">Sobre CR7</a>

  <h1 style="color: #333;">Contáctanos</h1>
  <form style="background-color: #f0f0f0; padding: 15px; width: 300px;">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" style="width: 100%; margin-bottom: 10px;"><br>

    <label for="correo">Correo:</label><br>
    <input type="email" id="correo" name="correo" style="width: 100%; margin-bottom: 10px;"><br>

    <label for="mensaje">Mensaje:</label><br>
    <textarea id="mensaje" name="mensaje" rows="4" style="width: 100%; margin-bottom: 10px;"></textarea><br>

    <button type="submit" style="background-color: #333; color: white; padding: 8px 12px;">Enviar</button>
  </form>

</body>
